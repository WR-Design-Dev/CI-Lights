name: Build firmware and publish updates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser_tools:
    name: Test browser installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Test administration update flow
        run: node tests/test_ota_ui.js
      - name: Test USB installer and optional erase
        run: node tests/test_web_flasher.mjs
      - name: Test publishing script workflow selection
        shell: pwsh
        run: ./tests/test_publish_script.ps1

  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-24.04
    needs: browser_tools
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    # Store the production key in this environment, restricted to main.
    # A repository-level secret would also be exposed to editable branch workflows.
    environment:
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'firmware-signing' || 'development-build' }}
    env:
      IDF_TARGET: esp32s3
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select unique CI version
        id: version
        shell: bash
        run: |
          version="1.0.$((1000 + GITHUB_RUN_NUMBER))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CI_LIGHTS_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare production signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python tools/prepare_ota_key.py --from-env
      - name: Prepare disposable development key
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python tools/prepare_ota_key.py --development
      - name: Build and verify firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py build
          python -m espsecure verify-signature --version 2 --keyfile secrets/ota_signing_key.pem build/CI-Lights.bin
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Package OTA release and browser installer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python tools/package_firmware.py --version "$CI_LIGHTS_RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python -c "from pathlib import Path; Path('secrets/ota_signing_key.pem').unlink(missing_ok=True)"
      - name: Upload development build
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-firmware-${{ steps.version.outputs.version }}
          path: |
            build/CI-Lights.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
          retention-days: 7
      - name: Upload release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/release/
          retention-days: 7
      - name: Upload browser installer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-installer
          path: dist/site/
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish GitHub Release and browser installer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    # Builds run for every push. Publication is serialized and never moves
    # the latest release back to an older build which happened to finish later.
    # Only publish the current main commit; older targets can also be rejected
    # by GitHub's workflow-scope restrictions when creating a release tag.
    concurrency:
      group: ci-lights-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-installer
          path: site/
      - name: Refuse an older publication
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; this build remains available as an artifact."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>release-api-error.txt)"; then
            :
          elif grep -q 'HTTP 404' release-api-error.txt; then
            latest=''
          else
            cat release-api-error.txt >&2
            exit 1
          fi
          candidate="${VERSION##*.}"
          if [[ -n "$latest" && ! "$latest" =~ ^v1\.0\.([0-9]+)$ ]]; then
            echo "Unrecognized latest release: $latest" >&2
            exit 1
          fi
          if [[ "$latest" =~ ^v1\.0\.([0-9]+)$ ]] && (( ${BASH_REMATCH[1]} > candidate )); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish signed release
        id: release
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # Retrying a failed deployment must reuse exactly the same firmware.
            gh release download "v$VERSION" --pattern SHA256SUMS --output previous-sums.txt
            cmp release/SHA256SUMS previous-sums.txt
            gh release edit "v$VERSION" --latest
          else
            if ! gh release create "v$VERSION" release/* --target "$GITHUB_SHA" \
              --title "CI-Lights $VERSION" --generate-notes --latest 2>release-create-error.txt; then
              # A push can move main after the preceding check. If GitHub then
              # refuses a historical release target, leave publication to its newer build.
              main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
              if [[ "$main_sha" != "$GITHUB_SHA" ]] &&
                 grep -q 'HTTP 403: Resource not accessible by integration' release-create-error.txt &&
                 ! gh release view "v$VERSION" > /dev/null 2>&1; then
                echo "main advanced during publication; its newer build will publish."
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              cat release-create-error.txt >&2
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/
      - name: Deploy browser installer
        id: deployment
        if: steps.release.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
