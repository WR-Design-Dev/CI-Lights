<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 252" role="img" aria-labelledby="title desc">
  <title id="title">CI-Lights</title>
  <desc id="desc">Eine stilisierte, dreifarbige Verkehrsampel. Die Lichter werden in der Verwaltungsseite passend zum LED-Zustand aktiviert.</desc>
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#374151"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1f2937" flood-opacity=".28"/>
    </filter>
    <filter id="glow-red" x="-200%" y="-200%" width="500%" height="500%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="spread"/>
      <feGaussianBlur in="spread" stdDeviation="10" result="outerBlur"/>
      <feFlood flood-color="#ff333e" flood-opacity=".95" result="outerColor"/>
      <feComposite in="outerColor" in2="outerBlur" operator="in" result="outerGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="innerBlur"/>
      <feFlood flood-color="#ffb0b5" result="innerColor"/>
      <feComposite in="innerColor" in2="innerBlur" operator="in" result="innerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-yellow" x="-200%" y="-200%" width="500%" height="500%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="spread"/>
      <feGaussianBlur in="spread" stdDeviation="10" result="outerBlur"/>
      <feFlood flood-color="#ffbd00" flood-opacity=".95" result="outerColor"/>
      <feComposite in="outerColor" in2="outerBlur" operator="in" result="outerGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="innerBlur"/>
      <feFlood flood-color="#fff2a0" result="innerColor"/>
      <feComposite in="innerColor" in2="innerBlur" operator="in" result="innerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-200%" y="-200%" width="500%" height="500%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="spread"/>
      <feGaussianBlur in="spread" stdDeviation="10" result="outerBlur"/>
      <feFlood flood-color="#73e522" flood-opacity=".95" result="outerColor"/>
      <feComposite in="outerColor" in2="outerBlur" operator="in" result="outerGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="innerBlur"/>
      <feFlood flood-color="#d9ffb4" result="innerColor"/>
      <feComposite in="innerColor" in2="innerBlur" operator="in" result="innerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M29 18h70l9 16v186l-9 16H29l-9-16V34z" fill="url(#housing)"/>
    <path d="M36 28h56" fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-width="3" opacity=".65"/>
    <path d="M30 236h68l12 16H18z" fill="#111827"/>
    <g fill="#0f172a" stroke="#94a3b8" stroke-width="2">
      <circle cx="64" cy="68" r="25"/>
      <circle cx="64" cy="132" r="25"/>
      <circle cx="64" cy="196" r="25"/>
    </g>
    <g>
      <circle id="red" class="lamp red" cx="64" cy="68" r="18"/>
      <circle id="yellow" class="lamp yellow" cx="64" cy="132" r="18"/>
      <circle id="green" class="lamp green" cx="64" cy="196" r="18"/>
    </g>
  </g>
  <style>
    .lamp{stroke-width:1.5;transition:fill .18s ease,filter .18s ease}
    .lamp.red,.lamp.yellow,.lamp.green{fill:#000;stroke:#536473}
    .lamp.is-on{stroke-width:2.5}
    .lamp.is-on.red{fill:#ff4248;stroke:#ffe8e8;filter:url(#glow-red)}
    .lamp.is-on.yellow{fill:#ffd000;stroke:#fff8d3;filter:url(#glow-yellow)}
    .lamp.is-on.green{fill:#92ed32;stroke:#edffdd;filter:url(#glow-green)}
    .jenkins-grey .lamp.yellow{fill:#9ca9b1;stroke:#e6edf1}
    .lamp.is-on.is-pulsing{animation:build-pulse 2.08s linear infinite}
    @keyframes build-pulse{
      0%,4%,96%,100%{opacity:1}
      46%,54%{opacity:.1}
    }
  </style>
</svg>
